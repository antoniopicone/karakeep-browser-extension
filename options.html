<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<title>Elenco lettura – Impostazioni</title>
<style>
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    max-width: 480px;
    margin: 40px auto;
    color: #1f2430;
  }
  h1 { font-size: 18px; }
  h2 { font-size: 14px; margin-top: 28px; }
  button {
    margin-top: 12px;
    padding: 9px 18px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
  }
  button:hover { background: #1d4ed8; }
  #status { margin-top: 14px; font-size: 13px; }
  .ok { color: #067647; }
  .err { color: #b42318; }
  .hint { font-size: 12px; color: #667085; margin-top: 4px; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; margin-top: 22px; }
  .checkbox-row input { width: auto; margin: 0; }
  .checkbox-row label { display: inline; margin: 0; font-weight: 600; font-size: 13px; }
  code { background: #f2f4f7; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
</style>
</head>
<body>
  <h1 data-i18n="optionsTitle"></h1>

  <h2 data-i18n="connectionSectionTitle"></h2>
  <p class="hint" data-i18n="connectionSectionHint"></p>
  <button id="testConnection" data-i18n="testConnectionBtn"></button>
  <div id="status"></div>

  <div class="checkbox-row">
    <input id="crawlToggle" type="checkbox" />
    <label for="crawlToggle" data-i18n="crawlToggleLabel"></label>
  </div>
  <div class="hint" data-i18n="crawlToggleHint"></div>

  <h2 data-i18n="importSectionTitle"></h2>
  <p class="hint" data-i18n="importSectionHint"></p>
  <input id="importFile" type="file" accept=".txt,text/plain" />
  <div id="importStatus" class="hint"></div>

  <script src="native-client.js"></script>
  <script src="options.js"></script>
</body>
</html>
