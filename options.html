<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<title>Elenco lettura – Impostazioni</title>
<style>
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    max-width: 480px;
    margin: 40px auto;
    color: #1f2430;
  }
  h1 { font-size: 18px; }
  label { display: block; margin-top: 16px; font-size: 13px; font-weight: 600; }
  input {
    width: 100%;
    padding: 8px 10px;
    margin-top: 6px;
    border: 1px solid #d0d5dd;
    border-radius: 6px;
    font-size: 14px;
    box-sizing: border-box;
  }
  button {
    margin-top: 20px;
    padding: 9px 18px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
  }
  button:hover { background: #1d4ed8; }
  #status { margin-top: 14px; font-size: 13px; }
  .ok { color: #067647; }
  .err { color: #b42318; }
  .hint { font-size: 12px; color: #667085; margin-top: 4px; }
</style>
</head>
<body>
  <h1 data-i18n="optionsTitle"></h1>

  <label for="baseUrl" data-i18n="baseUrlLabel"></label>
  <input id="baseUrl" type="text" placeholder="https://karakeep.tuodominio.it" />
  <div class="hint" data-i18n="baseUrlHint"></div>

  <label for="apiKey" data-i18n="apiKeyLabel"></label>
  <input id="apiKey" type="password" data-i18n-placeholder="apiKeyPlaceholder" />

  <button id="save" data-i18n="saveBtn"></button>
  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
