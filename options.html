<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<title>Elenco lettura – Impostazioni</title>
<style>
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    max-width: 480px;
    margin: 40px auto;
    color: #1f2430;
  }
  h1 { font-size: 18px; }
  label { display: block; margin-top: 16px; font-size: 13px; font-weight: 600; }
  input {
    width: 100%;
    padding: 8px 10px;
    margin-top: 6px;
    border: 1px solid #d0d5dd;
    border-radius: 6px;
    font-size: 14px;
    box-sizing: border-box;
  }
  button {
    margin-top: 20px;
    padding: 9px 18px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
  }
  button:hover { background: #1d4ed8; }
  #status { margin-top: 14px; font-size: 13px; }
  .ok { color: #067647; }
  .err { color: #b42318; }
  .hint { font-size: 12px; color: #667085; margin-top: 4px; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; margin-top: 22px; }
  .checkbox-row input { width: auto; margin: 0; }
  .checkbox-row label { display: inline; margin: 0; font-weight: 600; font-size: 13px; }
</style>
</head>
<body>
  <h1 data-i18n="optionsTitle"></h1>

  <label for="port" data-i18n="portLabel"></label>
  <input id="port" type="number" min="1" max="65535" placeholder="47100" />
  <div class="hint" data-i18n="portHint"></div>

  <label for="authToken" data-i18n="authTokenLabel"></label>
  <input id="authToken" type="password" data-i18n-placeholder="authTokenPlaceholder" />
  <div class="hint" data-i18n="authTokenHint"></div>

  <button id="save" data-i18n="saveBtn"></button>
  <div id="status"></div>

  <div class="checkbox-row">
    <input id="crawlToggle" type="checkbox" />
    <label for="crawlToggle" data-i18n="crawlToggleLabel"></label>
  </div>
  <div class="hint" data-i18n="crawlToggleHint"></div>

  <script src="options.js"></script>
</body>
</html>
